<header><div><h1>Carta Orgánica VCP</h1></div><div class="tools"><button id="allGraph" class="smallbtn">Grafo completo</button><button id="fitGraph" class="smallbtn">Centrar</button></div></header>
<main>
<section class="panel left"><div class="head">Explorar conceptos <span id="count" class="muted tiny">0</span></div><div class="body"><div id="categoryNav" class="category-nav"><details class="category-group"><summary>Bases</summary><div class="category-group-items"><button class="category-btn" data-category="all">Lista</button><button class="category-btn" data-category="note">Ubicación original</button></div></details><details class="category-group"><summary>Enfoque</summary><div class="category-group-items"><button class="category-btn" data-category="definition">Definiciones</button><button class="category-btn" data-category="notation">Participación</button><button class="category-btn" data-category="classification">Instituciones</button><button class="category-btn" data-category="editorialNote">Interpretación</button></div></details></div><div id="conceptList" class="list" hidden></div></div></section>
<section class="panel center"><div class="head">Relaciones ontológicas <span class="muted tiny" id="graphCount"></span></div><div class="tools" style="padding:0 12px"><label class="tiny"><input type="checkbox" id="showLiterals" style="width:auto" checked> Mostrar literales</label><label class="tiny"><input type="checkbox" id="showPredicates" style="width:auto" checked> Etiquetas de relaciones</label><select id="depth" style="width:100px"><option value="1">1 salto</option><option value="2" selected>2 saltos</option><option value="3">3 saltos</option></select></div><div class="graphScopes" id="graphScopes"><button class="scope-btn active" data-scope="all">Todo</button><button class="scope-btn" data-scope="principios">Principios</button><button class="scope-btn" data-scope="agenda">Agenda</button><button class="scope-btn" data-scope="compliance">Compliance</button><button class="scope-btn" data-scope="accountability">Accountability</button><button class="scope-btn" data-scope="engagement">Engagement</button><button class="scope-btn" data-scope="interareas">Inter-áreas</button></div><div class="graphwrap"><div id="network"></div></div></section>
<section class="panel right"><div class="head"><span id="detailTitle">Inspector completo</span><button id="copyURI" class="smallbtn">Copiar URI</button></div><div class="tabs" id="tabs"><button data-tab="overview" class="active">Ficha</button><button data-tab="definitions">Definiciones</button><button data-tab="notes">Notas</button><button data-tab="relations">Relaciones</button><button data-tab="corpus">Carta original</button><button data-tab="sparql">SPARQL</button></div>
<div id="overview" class="tabpage active"><div class="muted">Seleccione un nodo o un concepto.</div></div><div id="definitions" class="tabpage"></div><div id="notes" class="tabpage"></div><div id="relations" class="tabpage"></div><div id="corpus" class="tabpage"><div class="tools"><input id="corpusSearch" placeholder="Buscar texto en la Carta Orgánica"><button id="findCorpus">Buscar</button><button id="showWholeCorpus">Texto completo</button></div><div id="corpusMatches" class="tiny muted"></div><div id="corpusViewer" class="mdviewer"></div></div><div id="sparql" class="tabpage"><textarea id="sparqlQuery" rows="10">PREFIX skos: &lt;http://www.w3.org/2004/02/skos/core#&gt;
SELECT ?concepto ?etiqueta WHERE {
  ?concepto a skos:Concept .
  ?concepto skos:prefLabel ?etiqueta .
} LIMIT 100</textarea><div class="tools"><button id="runSPARQL" class="primary">Ejecutar</button><button id="exportCSV">Exportar CSV</button></div><div id="sparqlStatus" class="tiny muted"></div><div id="sparqlResults"></div></div>
</section></main>

<script>
'use strict';
const RDF='http://www.w3.org/1999/02/22-rdf-syntax-ns#',SKOS='http://www.w3.org/2004/02/skos/core#',RDFS='http://www.w3.org/2000/01/rdf-schema#',OWL='http://www.w3.org/2002/07/owl#';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=u=>{if(!u)return '';let p=u.split(/[/#]/);return decodeURIComponent(p[p.length-1]||p[p.length-2]||u)};
const human=t=>t?.termType==='Literal'?t.value+(t.language?' @'+t.language:'')+(t.datatype?.value&&!t.language&&t.datatype.value!=='http://www.w3.org/2001/XMLSchema#string'?' ^^'+short(t.datatype.value):''):t?.value||'';
let store,quads=[],subjects=[],selected=null,network=null,graphMode='all',corpusText='',lastRows=[],lastVars=[],engine=null,engineTried=false;
const obj=(s,p)=>store.getQuads(s,p,null,null).map(q=>q.object),out=s=>store.getQuads(s,null,null,null),incoming=s=>store.getQuads(null,null,s,null),first=(s,p)=>obj(s,p)[0]?.value;
const labels=s=>[...obj(s,SKOS+'prefLabel'),...obj(s,RDFS+'label'),...obj(s,SKOS+'altLabel')];
const label=s=>{let a=labels(s);return (a.find(x=>x.language==='es')||a.find(x=>!x.language)||a[0])?.value||short(s)};
const classes=s=>obj(s,RDF+'type').map(x=>x.value);
const notations=s=>obj(s,SKOS+'notation').map(x=>x.value);
const colors={A:'#ff00a8',B:'#fff000',C:'#39ff14',D:'#9653a9',concept:'#5377a6',scheme:'#d19a3d',class:'#925fb0',literal:'#a6b1c1',other:'#7b899d'};
const colorFor=s=>'#e8edf3';
const notationMeaning={A:'Ciudadanía o beneficiarios',B:'Instituciones',C:'Colaboración pública - privada'};
const notationDescription=n=>String(n).split(/[^A-Za-z]+/).map(v=>v.toUpperCase()).filter(v=>notationMeaning[v]).map(v=>v+' — '+notationMeaning[v]).join(' · ');
const notationDots=s=>[...new Set(notations(s).flatMap(n=>String(n).toUpperCase().split(/[^A-Z]+/).filter(v=>['A','B','C'].includes(v))))].map(n=>'<span class="dot" title="notation '+n+'" style="background:'+colors[n]+'"></span>').join('');
const isResource=t=>t.termType==='NamedNode'||t.termType==='BlankNode';
const idTerm=t=>t.termType==='BlankNode'?'_:'+t.value:t.value;
const termFromId=id=>id.startsWith('_:')?N3.DataFactory.blankNode(id.slice(2)):N3.DataFactory.namedNode(id);
function status(msg,error=false){if(error){console.error(msg);$('detailTitle').textContent=msg}else console.info(msg)}
async function load(){status('Cargando com.ttl y MD_COM.md…');try{if(!window.N3||!window.vis)throw Error('No se cargaron las bibliotecas externas. Compruebe la conexión a Internet.');let [ttl,md]=await Promise.all([fetch('./com.ttl',{cache:'no-store'}),fetch('../corpus/MD_COM.md',{cache:'no-store'})]);if(!ttl.ok)throw Error('No se encontró ./com.ttl (HTTP '+ttl.status+')');let source=await ttl.text();corpusText=md.ok?await md.text():'';let parser=new N3.Parser({format:'text/turtle'});quads=parser.parse(source);store=new N3.Store(quads);subjects=[...new Set(quads.map(q=>idTerm(q.subject)))].sort((a,b)=>label(a).localeCompare(label(b),'es'));populate();renderList();renderGraph();if(subjects.length)selectNode(subjects.find(x=>classes(x).includes(SKOS+'Concept'))||subjects[0],false);if(!corpusText)console.warn('Corpus no encontrado');if(!corpusText)$('corpusViewer').textContent='No se encontró ../corpus/MD_COM.md';}catch(e){status('Error: '+e.message,true);console.error(e);}}
const categoryProps={definition:[SKOS+'definition'],note:[SKOS+'note'],notation:[SKOS+'notation'],classification:[SKOS+'classification'],editorialNote:[SKOS+'editorialNote'],scopeNote:[SKOS+'scopeNote']};
let activeCategory='all',activeScope='all';
const categoryNames={definition:'Definiciones',note:'Ubicación original',notation:'Participación',classification:'Instituciones',editorialNote:'Interpretación',scopeNote:'Alcance'};
function categoryMatches(s,cat=activeCategory){return cat==='all'||out(s).some(q=>categoryProps[cat]?.includes(q.predicate.value)||cat==='classification'&&/^(classification|clasificacion|clasificación)$/i.test(short(q.predicate.value)))}
function classificationPredicates(s){return [...new Set(out(s).map(q=>q.predicate.value).filter(p=>/^(classification|clasificacion|clasificación)$/i.test(short(p))))]}
function scopeMembers(scope){
 const roots=subjects.filter(s=>[label(s),short(s),...obj(s,SKOS+'altLabel').map(x=>x.value)].some(value=>value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()===scope));
 const found=new Set(roots),queue=[...roots];
 // Incluir descendientes SKOS, tanto broader como narrower, sin incorporar ancestros ajenos.
 while(queue.length){let parent=queue.shift();for(let q of quads){let child=null;if(q.predicate.value===SKOS+'broader'&&isResource(q.object)&&idTerm(q.object)===parent)child=idTerm(q.subject);if(q.predicate.value===SKOS+'narrower'&&idTerm(q.subject)===parent&&isResource(q.object))child=idTerm(q.object);if(child&&!found.has(child)){found.add(child);queue.push(child)}}}
 return found;
}
function interAreaGraph(){
 const areas=['principios','agenda','compliance','accountability','engagement'];
 const membership=new Map();
 for(const area of areas)for(const id of scopeMembers(area)){
  if(!membership.has(id))membership.set(id,new Set());
  membership.get(id).add(area);
 }
 const links=quads.filter(q=>q.predicate.value===SKOS+'related'&&isResource(q.object)).filter(q=>{
  const a=membership.get(idTerm(q.subject)),b=membership.get(idTerm(q.object));
  return a&&b&&[...a].some(x=>[...b].some(y=>x!==y));
 });
 const ids=new Set(links.flatMap(q=>[idTerm(q.subject),idTerm(q.object)]));
 const nodes=new vis.DataSet([...ids].map(nodeData));
 const edges=new vis.DataSet(links.map((q,i)=>({id:'inter-'+i,from:idTerm(q.subject),to:idTerm(q.object),label:$('showPredicates').checked?'related':'',title:SKOS+'related',arrows:'to',color:{color:'#9eacc0'},font:{size:10,strokeWidth:3},smooth:{type:'dynamic'}})));
 return {nodes,edges};
}
function populate(){}
function renderList(){let query='';let matches=subjects.filter(s=>categoryMatches(s)&&(!query||[s,label(s),...out(s).map(q=>human(q.object))].join(' ').toLocaleLowerCase().includes(query)));$('count').textContent=matches.length;$('conceptList').innerHTML=matches.slice(0,1200).map(s=>'<button class="item '+(s===selected?'selected':'')+'" data-id="'+esc(s)+'">' +notationDots(s)+ ''+esc(label(s))+'</button>').join('')+(matches.length>1200?'<p class="muted">Mostrando los primeros 1200 resultados.</p>':'');$('conceptList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>selectNode(b.dataset.id,true));}
function setCategory(cat){activeCategory=cat;document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===cat));renderList();graphMode=cat==='all'?'all':'category';renderGraph();if(cat!=='all'){let match=subjects.find(s=>categoryMatches(s));if(match)selectNode(match,false);else{$('detailTitle').textContent=categoryNames[cat];$('overview').innerHTML='<p class="muted">No hay elementos con esta propiedad en el TTL.</p>';activateTab('overview')}}else if(selected)selectNode(selected,false)}
function activateTab(tab){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.tabpage').forEach(x=>x.classList.toggle('active',x.id===tab))}
function showCategory(s){if(activeCategory==='all')return;let props=activeCategory==='classification'?classificationPredicates(s):categoryProps[activeCategory];$('overview').innerHTML='<h3>'+esc(categoryNames[activeCategory])+'</h3>'+propertyList(s,props);activateTab('overview')}
function nodeData(s){const name=label(s);const normalized=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s*[-–]\s*/g,'-').trim();const special={'ciudadania o beneficiarios':colors.A,'instituciones':colors.B,'colaboracion publica-privada':colors.C};const bg=special[normalized]||(['principios','agenda','compliance','accountability','engagement'].includes(normalized)?'#ead7a0':'#e8edf3');return{id:s,label:name.slice(0,65),title:esc(name+'\n'+s+'\n'+notations(s).join(', ')),color:{background:bg,border:special[normalized]?'#46515d':'#7b899d',highlight:{background:bg,border:'#a2641a'}},font:{color:'#172338',size:12},shape:'box',margin:8,shapeProperties:{borderRadius:6}}}
function isTechnicalResource(id){
 if(id.startsWith(RDF)||id.startsWith(RDFS)||id.startsWith(OWL)||id.startsWith(SKOS))return true;
 // También ocultar clases declaradas localmente cuando se usan como objeto de rdf:type.
 const types=[RDFS+'Class',OWL+'Class'];
 return classes(id).some(c=>types.includes(c));
}
function renderGraph(){if(!store)return;if(activeScope==='interareas'){const data=interAreaGraph();if(network)network.destroy();network=new vis.Network($('network'),data,{physics:{enabled:true,stabilization:{iterations:80},barnesHut:{gravitationalConstant:-3500,springLength:135}},interaction:{hover:true,tooltipDelay:120},edges:{smooth:{type:'continuous'}}});network.on('click',p=>{if(p.nodes.length)selectNode(p.nodes[0],false)});network.on('doubleClick',p=>{if(p.nodes.length){selected=p.nodes[0];graphMode='focus';renderGraph()}});$('graphCount').textContent=data.nodes.length+' nodos · '+data.edges.length+' aristas';return;}let ids=new Set();if(graphMode==='focus'&&selected){ids.add(selected);for(let step=0;step<Number($('depth').value);step++){let next=new Set(ids);for(let q of quads){let a=idTerm(q.subject),b=isResource(q.object)?idTerm(q.object):null;if(ids.has(a)&&b)next.add(b);if(b&&ids.has(b))next.add(a)}ids=next}}else subjects.filter(x=>(graphMode!=='category'||categoryMatches(x))).forEach(x=>ids.add(x));if(activeScope!=='all'){let allowed=scopeMembers(activeScope);ids=new Set([...ids].filter(x=>allowed.has(x)));}let nodes=new Map(),edges=[],showLit=$('showLiterals').checked;if(!showLit)ids=new Set([...ids].filter(id=>!isTechnicalResource(id)));for(let id of ids)nodes.set(id,nodeData(id));let li=0;for(let q of quads){let s=idTerm(q.subject),p=q.predicate.value,o=q.object;if(!ids.has(s))continue;if(graphMode==='category'&&activeCategory!=='all'&&!categoryProps[activeCategory]?.includes(p)&&!(activeCategory==='classification'&&/^(classification|clasificacion|clasificación)$/i.test(short(p))))continue;if(isResource(o)){let t=idTerm(o);if(!ids.has(t))continue;edges.push({id:'e'+edges.length,from:s,to:t,label:$('showPredicates').checked?short(p):'',title:p,arrows:'to',color:{color:'#9eacc0'},font:{size:10,strokeWidth:3},smooth:{type:'dynamic'}})}else if(showLit){let litId='lit:'+li++;nodes.set(litId,{id:litId,label:human(o).slice(0,75),title:esc(human(o)+'\n'+p),shape:'box',color:{background:colors.literal,border:'#8d98a8'},font:{color:'#1d2d42',size:10},margin:5});edges.push({id:'e'+edges.length,from:s,to:litId,label:$('showPredicates').checked?short(p):'',title:p,arrows:'to',color:{color:'#c0c8d3'},font:{size:9}})}}let data={nodes:new vis.DataSet([...nodes.values()]),edges:new vis.DataSet(edges)};if(network)network.destroy();network=new vis.Network($('network'),data,{physics:{enabled:true,stabilization:{iterations:80},barnesHut:{gravitationalConstant:-3500,springLength:135}},layout:{hierarchical:false},interaction:{hover:true,tooltipDelay:120},edges:{smooth:{type:'continuous'}}});network.on('click',p=>{if(p.nodes.length&&!p.nodes[0].startsWith('lit:'))selectNode(p.nodes[0],false)});network.on('doubleClick',p=>{if(p.nodes.length&&!p.nodes[0].startsWith('lit:')){selected=p.nodes[0];graphMode='focus';renderGraph()}});$('graphCount').textContent=nodes.size+' nodos · '+edges.length+' aristas';}
const showTerms=(s,p)=>{let a=obj(s,p);return a.length?a.map(x=>'<div class="note '+(p===SKOS+'definition'?'definition':p===SKOS+'editorialNote'?'editorial':'')+'">'+esc(human(x))+'</div>').join(''):'<p class="muted tiny">Sin valores para esta propiedad.</p>'};
function selectNode(s,focus){selected=s;renderList();$('detailTitle').textContent=label(s);$('overview').innerHTML='<h3>'+esc(label(s))+'</h3><div class="tiny muted" style="overflow-wrap:anywhere">'+esc(s)+'</div><p>'+notations(s).map(n=>'<span class="tag">notation: '+esc(n)+(notationDescription(n)?' — '+esc(notationDescription(n)):'')+'</span>').join('')+classes(s).map(c=>'<span class="tag">'+esc(short(c))+'</span>').join('')+'</p><h4>Etiquetas</h4>'+propertyList(s,[SKOS+'prefLabel',SKOS+'altLabel',SKOS+'hiddenLabel',RDFS+'label'])+'<h4>Definición</h4>'+showTerms(s,SKOS+'definition')+'<h4>Instituciones y clasificación</h4>'+propertyList(s,[...classificationPredicates(s),SKOS+'inScheme',SKOS+'topConceptOf',RDF+'type',SKOS+'notation']);$('definitions').innerHTML='<h3>Definiciones</h3>'+propertyList(s,[SKOS+'definition',SKOS+'scopeNote',SKOS+'example']);let notePreds=[SKOS+'editorialNote',SKOS+'note',SKOS+'historyNote',SKOS+'changeNote'];let other=[...new Set(out(s).map(q=>q.predicate.value))].filter(p=>/note|comment|description|remark|source/i.test(p)&&!notePreds.includes(p));$('notes').innerHTML='<h3>Interpretación, ubicación y otras notas</h3>'+propertyList(s,[...notePreds,...other]);let outgoing=out(s),inc=incoming(termFromId(s));$('relations').innerHTML='<h3>Todos los predicados salientes ('+outgoing.length+')</h3>'+outgoing.map(q=>relHtml(q.predicate.value,q.object)).join('')+'<h3>Relaciones entrantes ('+inc.length+')</h3>'+inc.map(q=>relHtml(q.predicate.value,q.subject)).join('');if(focus){graphMode='focus';renderGraph()}if(network&&network.body.data.nodes.get(s)){network.selectNodes([s]);network.focus(s,{scale:1.1,animation:{duration:450}})}showCorpusFor(s);showCategory(s)}
function relHtml(p,t){let v=isResource(t),id=v?idTerm(t):null;return '<div class="relation"><b>'+esc(short(p))+'</b> <span class="tiny muted" title="'+esc(p)+'">'+esc(p)+'</span><div>'+(v?'<a class="link" data-go="'+esc(id)+'">'+esc(label(id))+'</a>':esc(human(t)))+'</div></div>'}
function propertyList(s,ps){let html='';for(let p of ps){let a=obj(s,p);if(!a.length)continue;html+='<h4>'+esc(short(p))+' <span class="muted tiny">('+a.length+')</span></h4>'+a.map(t=>isResource(t)?'<div class="relation"><a class="link" data-go="'+esc(idTerm(t))+'">'+esc(label(idTerm(t)))+'</a></div>':'<div class="note '+(p===SKOS+'editorialNote'?'editorial':p===SKOS+'definition'?'definition':'')+'">'+esc(human(t))+(p===SKOS+'notation'&&notationDescription(t.value)?' — '+esc(notationDescription(t.value)):'')+'</div>').join('')}return html||'<p class="muted">No hay valores registrados en el TTL para estas propiedades.</p>'}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go]');if(el)selectNode(el.dataset.go,true)});
const md=()=>window.markdownit?markdownit({html:false,linkify:true,breaks:true}):null;
function highlightHtml(text,term){let html=md()?md().render(text):'<pre>'+esc(text)+'</pre>';if(!term)return html;let safe=esc(term);if(!safe)return html;/* highlight only text nodes, never HTML attributes */return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,plain)=>tag||plain.replace(new RegExp(safe.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'<mark>$&</mark>'))}
function showCorpusFor(s){if(!corpusText)return;let candidates=[...labels(s).map(x=>x.value),short(s)].filter(x=>x&&x.length>=4).sort((a,b)=>b.length-a.length);let found=candidates.find(x=>corpusText.toLocaleLowerCase().includes(x.toLocaleLowerCase()));$('corpusMatches').textContent=found?'Coincidencia textual: «'+found+'». La coincidencia no equivale a una referencia jurídica verificada.':'Sin coincidencia textual automática; pruebe otra expresión.';if(found){let idx=corpusText.toLocaleLowerCase().indexOf(found.toLocaleLowerCase());let start=Math.max(0,corpusText.lastIndexOf('\n#',idx-1));let end=corpusText.indexOf('\n#',idx+found.length);let snippet=corpusText.slice(start,Math.min(corpusText.length,end>idx?end:idx+2000));$('corpusViewer').innerHTML=highlightHtml(snippet,found)}else $('corpusViewer').innerHTML='<p class="muted">Use la búsqueda para encontrar pasajes de la norma.</p>'}
function corpusFind(){let term=$('corpusSearch').value.trim();if(!term||!corpusText)return;let low=corpusText.toLocaleLowerCase(),needle=term.toLocaleLowerCase(),at=0,hits=[];while((at=low.indexOf(needle,at))!==-1&&hits.length<150){hits.push(at);at+=needle.length} $('corpusMatches').textContent=hits.length+(hits.length===150?' o más':'')+' coincidencias de «'+term+'»';$('corpusViewer').innerHTML=hits.slice(0,35).map((idx,i)=>'<div class="relation"><span class="muted tiny">Coincidencia '+(i+1)+'</span>'+highlightHtml(corpusText.slice(Math.max(0,idx-260),Math.min(corpusText.length,idx+550)),term)+'</div>').join('')||'<p>No se encontraron coincidencias.</p>'}
$('findCorpus').onclick=corpusFind;$('corpusSearch').onkeydown=e=>{if(e.key==='Enter')corpusFind()};$('showWholeCorpus').onclick=()=>{$('corpusMatches').textContent='Texto completo del Markdown';$('corpusViewer').innerHTML=highlightHtml(corpusText,'')};$('copyURI').onclick=()=>selected&&navigator.clipboard?.writeText(selected);
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{document.getElementById('conceptList').hidden=false;setCategory(b.dataset.category)});$('allGraph').onclick=()=>{graphMode='all';renderGraph()};$('fitGraph').onclick=()=>network?.fit({animation:true});['showLiterals','showPredicates','depth'].forEach(x=>$(x).onchange=renderGraph);document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{activeScope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));renderGraph()});$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)activateTab(b.dataset.tab)};

async function initEngine(){if(engineTried)return engine;engineTried=true;try{let mod=await import('https://esm.sh/@comunica/query-sparql@4.4.0?bundle');engine=new mod.QueryEngine()}catch(e){console.warn('Comunica no disponible:',e)}return engine}
function expandPrefixes(query){let prefixes={rdf:RDF,skos:SKOS,rdfs:RDFS,owl:OWL};for(let m of query.matchAll(/PREFIX\s+([\w-]+):\s*<([^>]+)>/gi))prefixes[m[1]]=m[2];return prefixes}
function parseToken(t,prefixes){if(t==='a')return RDF+'type';if(t.startsWith('<'))return t.slice(1,-1);if(t.startsWith('?'))return t;let m=t.match(/^([\w-]+):(.+)$/);if(m&&prefixes[m[1]])return prefixes[m[1]]+m[2];if(t.startsWith('"'))return t.slice(1,-1);return t}
function basicSelect(query){if(!/^\s*(PREFIX\s+[^\n]+\s*)*SELECT\b/i.test(query))throw Error('Motor alternativo: solo SELECT. Para SPARQL 1.1 completo se requiere Comunica.');let vars=[...query.match(/SELECT\s+(?:DISTINCT\s+)?([\s\S]*?)\s+WHERE\s*\{/i)?.[1].matchAll(/\?[\w]+/g)||[]].map(x=>x[0].slice(1));let body=query.match(/WHERE\s*\{([\s\S]*?)\}\s*(?:LIMIT|OFFSET|ORDER|$)/i)?.[1];if(!body)throw Error('No se pudo interpretar WHERE.');let prefixes=expandPrefixes(query);let parts=body.replace(/#[^\n]*/g,'').split(/\s+\.\s*(?=\?|<|[a-z]+:|$)/i).map(x=>x.trim()).filter(Boolean);let bindings=[{}];for(let part of parts){if(/^(FILTER|OPTIONAL|BIND|UNION|GRAPH|VALUES|MINUS|SERVICE)\b/i.test(part))throw Error('Esta construcción necesita el motor SPARQL completo (Comunica).');let tokens=part.match(/<[^>]+>|"(?:\\.|[^"])*"(?:@[a-z-]+)?|\?[\w]+|[\w-]+:[\w-]+|\ba\b/g);if(!tokens||tokens.length!==3)throw Error('El motor alternativo solo admite patrones triples simples: '+part);let [a,b,c]=tokens.map(t=>parseToken(t,prefixes));let next=[];for(let bind of bindings){for(let q of quads){let ts=[q.subject.value,q.predicate.value,q.object.value],pat=[a,b,c],copy={...bind},ok=true;for(let i=0;i<3;i++){let v=pat[i];if(v.startsWith('?')){let key=v.slice(1);if(copy[key]!==undefined&&copy[key]!==ts[i]){ok=false;break}copy[key]=ts[i]}else if(v!==ts[i]){ok=false;break}}if(ok)next.push(copy)}}bindings=next;if(bindings.length>100000)throw Error('Resultado intermedio demasiado grande. Agregue filtros o patrones.')}let lim=Number(query.match(/LIMIT\s+(\d+)/i)?.[1]||500);return{vars:vars.length?vars:Object.keys(bindings[0]||{}),rows:bindings.slice(0,lim)}}
async function runSPARQL(){let query=$('sparqlQuery').value;$('sparqlStatus').textContent='Ejecutando…';$('sparqlResults').innerHTML='';try{let e=await initEngine();let result;if(e){let stream=await e.queryBindings(query,{sources:[store]});let arr=await stream.toArray();let vars=[...new Set(arr.flatMap(b=>[...b.keys()].map(k=>k.value||String(k))))];let rows=arr.map(b=>Object.fromEntries([...b].map(([k,v])=>[k.value||String(k),human(v)])));result={vars,rows};$('sparqlStatus').textContent='Motor Comunica · SPARQL 1.1 · '+rows.length+' filas'}else{result=basicSelect(query);$('sparqlStatus').textContent='Motor alternativo SELECT (patrones triples simples; no SPARQL 1.1 completo) · '+result.rows.length+' filas'}lastRows=result.rows;lastVars=result.vars;$('sparqlResults').innerHTML='<table><thead><tr>'+lastVars.map(v=>'<th>'+esc(v)+'</th>').join('')+'</tr></thead><tbody>'+lastRows.slice(0,1000).map(row=>'<tr>'+lastVars.map(v=>'<td>'+esc(row[v]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}catch(err){$('sparqlStatus').textContent='Error de consulta: '+err.message}}
$('runSPARQL').onclick=runSPARQL;$('exportCSV').onclick=()=>{if(!lastRows.length)return;let cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[lastVars.map(cell).join(','),...lastRows.map(r=>lastVars.map(k=>cell(r[k])).join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='consulta-sparql.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
